<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffe9c4" />
    <title>合成大西瓜</title>
    <link rel="icon" href="assets/theme/04.png" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="hud">
        <div class="hud-left">
          <div class="score-box">
            <span class="label">分数</span>
            <span id="score" class="value">0</span>
          </div>
          <div class="best-box">
            <span class="label">最高</span>
            <span id="best" class="value">0</span>
          </div>
        </div>
        <div class="hud-right">
          <div class="next-box" title="下一个">
            <span class="label">下一个</span>
            <img id="nextImg" alt="" />
          </div>
          <select id="theme" class="theme-select" aria-label="选择主题"></select>
          <button id="mute" class="icon-btn" type="button" aria-label="关闭音效">🔊</button>
          <button id="restart" class="icon-btn" type="button" aria-label="重新开始">↻</button>
        </div>
      </header>

      <main class="stage">
        <canvas id="game"></canvas>

        <div id="loading" class="loading">
          <div class="spinner"></div>
          <p>正在加载素材…</p>
        </div>

        <div id="overlay" class="overlay">
          <div class="panel">
            <h2>游戏结束</h2>
            <p class="sub">水果堆过顶线啦</p>
            <div class="result">
              <div>
                <span class="rlabel">本局</span>
                <strong id="finalScore">0</strong>
              </div>
              <div>
                <span class="rlabel">最高</span>
                <strong id="finalBest">0</strong>
              </div>
            </div>
            <button id="again" class="primary-btn" type="button">再来一局</button>
          </div>
        </div>
      </main>

      <footer class="tips">
        <span>移动鼠标 / 手指瞄准，点击或空格投放</span>
        <span class="dot">·</span>
        <span>← → 微调</span>
      </footer>
    </div>

    <script src="vendor/matter.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
